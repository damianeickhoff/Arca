# Builds the Docker image and publishes it to Docker Hub (damianeickhoff/arca, what Unraid
# pulls) and the GitHub Container Registry, with the same tags on both:
#   damianeickhoff/arca:latest      — a version tag (v1.6.0) only, never a branch push
#   damianeickhoff/arca:1.6.0       — the same version tag, the plain form the Docker Hub
#                                     tags have always had
#   damianeickhoff/arca:v1.6.0      — the same version tag, as written
#   damianeickhoff/arca:<branch>    — any branch except master (dev is the test image on
#                                     Unraid), to try it before merging
#   damianeickhoff/arca:sha-abc1234 — every build
# A release is one build: the vX.Y.Z tag. Pushes to master build nothing here (the docs
# site has its own workflow, docs.yml), so the release commit is not built twice.
# GHCR needs no secrets (GITHUB_TOKEN). Docker Hub needs the repository secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with Read & Write); without
# them the build still runs and publishes to GHCR only.
name: Publish image

on:
  push:
    # No build for Dependabot's branches: its PRs are reviewed on GitHub, and runs it
    # triggers get no repository secrets, so the Docker Hub login would fail anyway.
    branches: ["**", "!master", "!dependabot/**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "unraid/**", "docs/**", "website/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/damianeickhoff/arca,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            # latest follows the version tag, not a branch.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=tag
            # Plain version too (1.6.0), the form the Docker Hub tags have always had.
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Docker media types and no provenance index: GHCR won't serve an OCI manifest
          # to Unraid's update check, which then shows the version as "not available".
          outputs: type=registry,oci-mediatypes=false
          provenance: false
          sbom: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
